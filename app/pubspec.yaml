name: coloros_notes
description: "A faithful 1:1 cross-platform replica of ColorOS Notes."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # WebView & Editor Host
  flutter_inappwebview: ^6.1.5

  # Local Database (Room v47 Schema Mapping)
  drift: ^2.20.0
  drift_flutter: ^0.2.0
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24

  # File System & Utilities
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.5.1
  crypto: ^3.0.5

  # Media & Hardware Adapters
  record: ^5.1.2
  audioplayers: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/tiptap/
    - assets/tiptap/assets/
